<style>
/* Layout: one full-bleed canvas, a moonlit forest arena. Single dark look by choice. */
:root {
  --bg: #0b1410;
  --ground: #172a1f;
  --fg: #ffffff;
  --amber: #ffc247;
  --danger: #ff3b3b;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Rubik", "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#game { display: block; width: 100%; height: 100%; outline: none; cursor: crosshair; }
#game:focus-visible { box-shadow: inset 0 0 0 3px var(--amber); }

/* Neutral age screen (Android app only): shown once before any ad or consent request. */
#age { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(8,14,11,0.96); padding: 16px; }
#age[hidden] { display: none; }
#age .card { width: min(420px, 100%); display: grid; gap: 16px; text-align: center; color: var(--fg); font-family: var(--body); }
#age h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; color: var(--amber); }
#age p { margin: 0; font-size: 16px; line-height: 1.45; color: rgba(255,255,255,0.8); }
#age select, #age button { font: 700 20px var(--body); border-radius: 14px; min-height: 56px; }
#age select { background: #13251b; color: #fff; border: 2px solid #2f4a3a; padding: 0 14px; }
#age button { background: #2979FF; color: #fff; border: 0; }
#age button:disabled { background: #455A64; color: rgba(255,255,255,0.6); }
</style>
</head><body>

<div id="age" hidden role="dialog" aria-modal="true" aria-labelledby="age-title">
  <div class="card">
    <h2 id="age-title">Welcome</h2>
    <p>Please enter the year you were born. This is stored only on your device and is used to choose suitable ads.</p>
    <select id="age-year" aria-label="Year of birth"><option value="">Year of birth</option></select>
    <button id="age-ok" type="button" disabled>CONTINUE</button>
  </div>
</div>
<canvas id="game" tabindex="0" aria-label="Wolf Clash Arena game. Drag or use arrow keys to run, space to dash."></canvas>

<script>
(() => {
"use strict";
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const DISPLAY = '"Bungee", "Arial Black", Impact, sans-serif';
const BODY = '"Rubik", "Segoe UI", Roboto, sans-serif';

// ---------------- storage (per-viewer, optional) ----------------
const store = {
  get(k, d) { try { const v = localStorage.getItem("wca_" + k); return v == null ? d : parseInt(v, 10); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("wca_" + k, String(v)); } catch (e) {} }
};

// ---------------- internet gate ----------------
// In the Android app a native bridge does a real HTTPS check; in a browser we use the online signal.
const NET = { CHECKING: 0, ONLINE: 1, OFFLINE: 2 };
const bridge = window.WolfBridge || null;
const net = {
  state: NET.CHECKING, until: 0,
  check() { if (bridge) { try { bridge.retry(); } catch (e) {} } this.state = NET.CHECKING; this.until = performance.now() + 700; },
  tick(now) {
    if (bridge) { try { this.state = bridge.netState(); } catch (e) { this.state = NET.OFFLINE; } return; }
    if (this.state === NET.CHECKING && now < this.until) return;
    this.state = navigator.onLine ? NET.ONLINE : NET.OFFLINE;
  },
  online() { return this.state === NET.ONLINE; }
};
net.check();
addEventListener("online", () => net.check());
addEventListener("offline", () => { if (!bridge) net.state = NET.OFFLINE; });

// ---------------- ads (Android app only; absent in a browser) ----------------
const ads = window.WolfAds || null;
const adCall = (fn, ...a) => { try { return ads ? ads[fn](...a) : false; } catch (e) { return false; } };
const rewardedReady = () => !!adCall("rewardedReady");
let revived = false, doubled = false, adBusy = false, pendingAfterAd = null, watchedRewardThisRun = false;
let runsSinceInterstitial = store.get("runsSinceAd", 0);
let reviveT = 0, reviveWaiting = false;
const INTERSTITIAL_EVERY = 3;

// ---------------- neutral age screen (Android app only, asked once) ----------------
(() => {
  if (!ads || !adCall("needsAge")) return;
  const box = document.getElementById("age"), sel = document.getElementById("age-year"), ok = document.getElementById("age-ok");
  const now = new Date().getFullYear();
  for (let y = now; y >= now - 100; y--) sel.add(new Option(String(y), String(y)));
  sel.addEventListener("change", () => { ok.disabled = !sel.value; });
  ok.addEventListener("click", () => { if (!sel.value) return; adCall("setBirthYear", parseInt(sel.value, 10)); box.hidden = true; cv.focus(); });
  box.hidden = false;
})();

// ---------------- tuning ----------------
const PLAYER = 0, HUNTER = 1, PREY = 2;
const WORLD = 3600, FOOD_BASE = 520, FOOD_MAX = 1200, PLAYER_SPEED = 250, START_MASS = 10;
const HEAD_AT = [0, 60, 150, 300, 520];          // mass needed for 1..5 heads
const HEAD_NAMES = ["", "ONE HEAD", "TWO HEADS!", "THREE HEADS!", "FOUR HEADS!", "FIVE HEADS!"];
const powerMul = h => 1 + 0.25 * (h - 1);       // each extra head = +25% bite power
const headsFor = m => { let h = 1; for (let i = 1; i < HEAD_AT.length; i++) if (m >= HEAD_AT[i]) h = i + 1; return h; };
const PALETTES = [
  { c1: "#8d939c", c2: "#5b6068", c3: "#d6d9de", eye: "#ffd23f" },
  { c1: "#4a4d55", c2: "#2b2d33", c3: "#8e9199", eye: "#ff3b3b" },
  { c1: "#b5563a", c2: "#7a3322", c3: "#e9b796", eye: "#ffd23f" },
  { c1: "#8a6a4a", c2: "#5a432d", c3: "#d8c3a5", eye: "#ffb03b" },
  { c1: "#e8edf2", c2: "#aab4bf", c3: "#ffffff", eye: "#59c7ff" }
];
const PLAYER_PAL = { c1: "#6f8fb8", c2: "#3f5878", c3: "#d9e6f5", eye: "#ffd740" };
const BOSS_PAL = { c1: "#3b2350", c2: "#22122f", c3: "#7d5a99", eye: "#ff2a2a" };
const TOUCH = (() => { try { return matchMedia("(pointer: coarse)").matches; } catch (e) { return false; } })();
const rnd = Math.random;
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const normAngle = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

// ---------------- Wolf ----------------
class Wolf {
  constructor(type, x, y, angle, mass, pal) {
    Object.assign(this, { type, x, y, angle, pal, alive: true, life: 0, maxLife: 9999, leaving: false,
      wanderTimer: 0, wanderAngle: angle, flash: 0, phase: rnd() * 6, biteT: 0, kx: 0, ky: 0, speed: 200, turnRate: 3 });
    this.facing = Math.cos(angle) >= 0 ? 1 : -1;
    this.mass = Math.max(1, mass); this.heads = headsFor(this.mass);
  }
  get r() { return 30 + Math.sqrt(Math.min(this.mass, 2000)) * 2.2; }
  power() { return Math.round(this.mass * powerMul(this.heads)); }
  grow(d) { this.mass = Math.max(3, this.mass + d); const h = headsFor(this.mass); const up = h > this.heads; if (up) this.heads = h; return up; }
  move(dt, target, mul, world) {
    let diff = normAngle(target - this.angle); const mt = this.turnRate * dt;
    this.angle = normAngle(this.angle + clamp(diff, -mt, mt));
    const v = this.speed * mul * dt;
    this.x += Math.cos(this.angle) * v + this.kx * dt; this.y += Math.sin(this.angle) * v + this.ky * dt;
    this.kx *= 0.88; this.ky *= 0.88;
    const r = this.r; this.x = clamp(this.x, r, world - r); this.y = clamp(this.y, r, world - r);
    const want = Math.cos(this.angle) >= 0 ? 1 : -1;
    this.facing += clamp(want - this.facing, -dt * 9, dt * 9);
    this.phase += v / (r * 0.55);
    if (this.flash > 0) this.flash -= dt;
    if (this.biteT > 0) this.biteT -= dt;
  }
}

// ---------------- state ----------------
const MENU = 0, PLAYING = 1, BOSS = 2, RESULTS = 3, REVIVE = 4;
let w = 0, h = 0, u = 1, dpr = 1;
let state = MENU, paused = false;
let player = null, enemies = [], food = [], rabbits = [], decor = [];
let particles = [], particlesInWorld = true, floaters = [];
let elapsed = 0, foodScore = 0, killScore = 0, kills = 0, maxMass = 0, hearts = 3;
let spawnTimer = 0, preyTimer = 0, invuln = 0, dashTime = 0, dashCooldown = 0, shake = 0;
let toast = null, toastTime = 0, banner = null, bannerTime = 0;
let bossLevel = Math.max(1, store.get("bossLevel", 1)), bestScore = store.get("best", 0);
let bossMaxHp = 0, bossHp = 0, clashRemaining = 0, clashStartMass = 0, bossDamage = 0, clashHeads = 1;
let clashTimer = 0, clashInterval = 0, bossIntro = 0, bossOutro = 0, bossHit = 0, bossDefeated = false, runBossLevel = 1;
let orbs = [];
let survivalScore = 0, bossScore = 0, totalScore = 0, newBest = false;
let camX = 0, camY = 0, zoom = 1;
let joyId = null, joyActive = false, joyBaseX = 0, joyBaseY = 0, joyX = 0, joyY = 0, targetAngle = 0;
const keys = new Set();
let demoT = 0;
const demo = new Wolf(PLAYER, 0, 0, 0, 10, PLAYER_PAL);

for (let i = 0; i < 520; i++) decor.push({ x: rnd() * WORLD, y: rnd() * WORLD, k: rnd() < 0.7 ? 0 : (rnd() < 0.6 ? 1 : 2), s: 0.6 + rnd() * 0.9, t: rnd() * 6 });

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  w = r.width; h = r.height; u = Math.min(w, h) / 720;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
}
addEventListener("resize", resize);

// ---------------- spawning ----------------
const randFoodValue = () => rnd() < 0.1 ? 3 : 1;
function spawnFood(x, y, v) {
  if (food.length >= FOOD_MAX) return;
  food.push({ x: clamp(x, 20, WORLD - 20), y: clamp(y, 20, WORLD - 20), v, rot: rnd() * Math.PI * 2 });
}
function spawnPointAround(minD, maxD) {
  let px = 0, py = 0;
  for (let k = 0; k < 20; k++) {
    const a = rnd() * Math.PI * 2, d = minD + rnd() * (maxD - minD);
    px = player.x + Math.cos(a) * d; py = player.y + Math.sin(a) * d;
    if (px > 150 && py > 150 && px < WORLD - 150 && py < WORLD - 150) return [px, py];
  }
  return [clamp(px, 150, WORLD - 150), clamp(py, 150, WORLD - 150)];
}
function spawnHunter() {
  const [x, y] = spawnPointAround(1000, 1400);

function burst(x, y, color, n, world) {

  for (let i = 0; i < n && particles.length < 400; i++) {
    const a = rnd() * Math.PI * 2, sp = (80 + rnd() * 260) * (world ? 1 : u);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + rnd() * 0.5, size: (4 + rnd() * 6) * (world ? 1 : u), c: color });

function updateParticles(dt) {

// ---------------- buttons ----------------

const againBtn = () => btn(h * 0.80, 380), menuBtn = () => btn(h * 0.80 + 110 * u, 380);
const doubleBtn = () => btn(h * 0.70, 440);

const privacyBtn = () => ({ l: w - 230 * u, t: h - 70 * u, r: w - 10 * u, b: h - 10 * u });

// ---------------- input ----------------
function onPointerDown(id, x, y) {

  if (adBusy) return;
  if (state === MENU) {
    if (hit(playBtn(), x, y)) startGame();
    else if (ads && adCall("privacyRequired") && hit(privacyBtn(), x, y)) adCall("showPrivacy");
    return;
  }
  if (state === RESULTS) {
    if (showDouble() && hit(doubleBtn(), x, y)) { adBusy = true; adCall("showRewarded", "double"); }
    else if (hit(againBtn(), x, y)) afterRun(startGame);
    else if (hit(menuBtn(), x, y)) afterRun(() => { state = MENU; });
    return;
  }
  if (state === REVIVE) {
    if (reviveWaiting) return;
    if (hit(reviveBtn(), x, y)) { reviveWaiting = true; adBusy = true; adCall("showRewarded", "revive"); }
    else if (hit(noThanksBtn(), x, y)) knockOut();
    return;
  }
  if (state === BOSS) { if (bossIntro > 0.3) bossIntro = 0.3; return; }

// ---------------- the wolf ----------------
// Side view, facing right in local space (flipped by `facing`). r = body radius.

    const ex = lx + sw * r * 0.42, ey = r * 0.86 - Math.max(0, -Math.cos(ph)) * 0;

    line((lx + ex) / 2 + sw * r * 0.05, r * 0.5, ex, ey, col, r * 0.22);
    ellipse(ex + r * 0.06, ey, r * 0.15, r * 0.09, paw);

  leg(0.58 * r, Math.sin(ph), pal.c2, pal.c2);

  circle(-1.9 * r, -0.55 * r + sway * 0.6, r * 0.19, pal.c3);
  // body
  ellipse(0, 0, r * 1.12, r * 0.54, pal.c1);
  ellipse(-0.1 * r, -0.3 * r, r * 0.85, r * 0.2, pal.c2);
  ellipse(0.08 * r, 0.24 * r, r * 0.74, r * 0.24, pal.c3);
  // near legs
  leg(-0.5 * r, Math.sin(ph), pal.c1, pal.c3);
  leg(0.72 * r, Math.sin(ph + Math.PI), pal.c1, pal.c3);
  // necks + heads
  const hs = 1 - (n - 1) * 0.05, hr = r * hs;

  const heads = [];
  for (let i = 0; i < n; i++) {
    const spread = 0.55 + n * 0.3, a = n === 1 ? -0.38 : -0.38 - spread / 2 + (spread * i) / (n - 1);
    const wob = Math.sin(ph * 0.5 + i * 1.7) * 0.06;

  circle(baseX, baseY, r * 0.42, pal.c1);

    poly([-0.08, -0.22, 0.02, -0.66, 0.18, -0.2], pal.c2);
    poly([-0.04, -0.24, 0.02, -0.5, 0.1, -0.24], pal.c3);
    // lower jaw
    if (open > 0) {
      poly([0.12, 0.1, 0.66, 0.1 + open * 0.28, 0.62, 0.2 + open * 0.3, 0.1, 0.24], pal.c3);
      poly([0.18, 0.08, 0.62, 0.06 + open * 0.24, 0.6, 0.12 + open * 0.24, 0.18, 0.14], "#5a0d14");
      poly([0.3, 0.1 + open * 0.1, 0.34, 0.18 + open * 0.12, 0.38, 0.1 + open * 0.12], "#fff");
      poly([0.48, 0.12 + open * 0.17, 0.52, 0.2 + open * 0.18, 0.56, 0.12 + open * 0.18], "#fff");
    }

    poly([0.12, -0.16, 0.74, -0.03, 0.75, 0.09, 0.14, 0.18], pal.c1);
    poly([0.2, 0.06, 0.74, 0.06, 0.73, 0.11, 0.2, 0.18], pal.c3);
    if (open > 0) { poly([0.36, 0.09, 0.4, 0.17, 0.44, 0.09], "#fff"); poly([0.6, 0.09, 0.63, 0.16, 0.66, 0.09], "#fff"); }
    circle(0.74, 0.02, 0.08, "#151515");

    circle(0.14, -0.08, 0.09, pal.eye); circle(0.17, -0.08, 0.045, "#111");

}

function drawWorld() {

  ctx.translate(w / 2 + sx, h / 2 + sy); ctx.scale(zoom, zoom); ctx.translate(-camX, -camY);

    if (d.k === 0) { for (let i = -1; i <= 1; i++) line(d.x + i * 5 * d.s, d.y, d.x + i * 9 * d.s, d.y - 14 * d.s, "#23412f", 3); }
    else if (d.k === 1) { ellipse(d.x, d.y, 22 * d.s, 14 * d.s, "#24352e"); ellipse(d.x - 5 * d.s, d.y - 4 * d.s, 10 * d.s, 5 * d.s, "#2f453b"); }
    else { circle(d.x, d.y, 26 * d.s, "#1f3b2a"); circle(d.x + 14 * d.s, d.y - 8 * d.s, 18 * d.s, "#25472f"); circle(d.x - 6 * d.s, d.y - 12 * d.s, 14 * d.s, "#2b5236"); }

  ctx.strokeStyle = "#7a5233"; ctx.lineWidth = 8; ctx.strokeRect(0, 0, WORLD, WORLD);

  for (const f of food) if (f.x > l && f.x < r && f.y > t && f.y < b) drawMeat(f);

  for (const e of all) {

  ctx.globalAlpha = 1;

function drawLabel(s, pp) {

  text(`ALPHA BOSS  Lv.${runBossLevel}`, w / 2, y0 - 8 * u, 24 * u, "#FF8A80");
  rrect(x0, y0, x0 + bw, y0 + 30 * u, 15 * u, "#333");
  if (bossHp > 0) rrect(x0, y0, x0 + bw * bossHp / bossMaxHp, y0 + 30 * u, 15 * u, "#FF3B3B");
  text(`HP ${Math.max(0, bossHp) | 0} / ${bossMaxHp}`, w / 2, y0 + 22 * u, 18 * u, "#fff", "center", BODY);

  text(String(clashRemaining), px0(), py0() + pr * 1.6, 40 * u, "#82b1ff");
  text(`mass left · ×${clashHeads} damage per hit`, px0(), py0() + pr * 1.6 + 30 * u, 20 * u, "rgba(255,255,255,0.8)", "center", BODY);

  if (!particlesInWorld) drawParticles();
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.t * 1.5); text(f.s, f.x, f.y, 30 * u, f.c); }
  ctx.globalAlpha = 1;
  if (bossIntro > 0 || bossOutro > 0) {
    ctx.fillStyle = "rgba(0,0,0,0.62)"; ctx.fillRect(0, h * 0.84, w, h * 0.14);
    const cy = h * 0.905;
    if (bossIntro > 0) {
      text(bossIntro > 1.3 ? "KNOCKED OUT!" : "ALPHA CLASH!", w / 2, cy, 50 * u, bossIntro > 1.3 ? "#FF5252" : "#FFD740");
      text(`Mass ${clashStartMass} × ${clashHeads} head${clashHeads > 1 ? "s" : ""} vs Boss HP ${bossMaxHp}`, w / 2, cy + 38 * u, 22 * u, "#fff", "center", BODY);
    } else {
      text(bossDefeated ? "ALPHA DEFEATED!" : "ALPHA SURVIVED", w / 2, cy, 48 * u, bossDefeated ? "#FFD740" : "#FF8A80");
      text("Damage dealt: " + Math.min(bossDamage, bossMaxHp), w / 2, cy + 38 * u, 24 * u, "#fff", "center", BODY);
    }
  }
}
function drawRevive() {
  ctx.fillStyle = "rgba(0,0,0,0.72)"; ctx.fillRect(0, 0, w, h);
  text("KNOCKED DOWN!", w / 2, h * 0.24, 56 * u, "#FF5252");
  text("Watch a short ad to get back up", w / 2, h * 0.24 + 46 * u, 26 * u, "#fff", "center", BODY);
  text("with full hearts.", w / 2, h * 0.24 + 80 * u, 26 * u, "#fff", "center", BODY);
  const cx = w / 2, cy = h * 0.42, R0 = 56 * u;
  ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 10 * u; ctx.beginPath(); ctx.arc(cx, cy, R0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = "#ffc247"; ctx.beginPath(); ctx.arc(cx, cy, R0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, reviveT) / 6); ctx.stroke();
  text(String(Math.ceil(Math.max(0, reviveT))), cx, cy + 18 * u, 50 * u, "#fff");
  if (reviveWaiting) text("Loading ad…", w / 2, h * 0.56 + 14 * u, 34 * u, "#ffc247");
  else { button(reviveBtn(), "▶ WATCH AD · REVIVE", "#E0A100"); button(noThanksBtn(), "NO THANKS", "#455A64"); }
}
function drawResults() {
  text(bossDefeated ? "VICTORY!" : "GAME OVER", w / 2, h * 0.12, 64 * u, "#FFD740");
  const pw = Math.min(w - 40 * u, 620 * u), top = h * 0.16, bot = h * 0.64;
  rrect(w / 2 - pw / 2, top, w / 2 + pw / 2, bot, 30 * u, "#1b3326");
  const lx = w / 2 - pw / 2 + 36 * u, rx = w / 2 + pw / 2 - 36 * u, step = Math.min(52 * u, (bot - top - 120 * u) / 9);
  let y = top + 60 * u;
  const sec = elapsed | 0;
  const rows = [
    ["Survived", `${(sec / 60) | 0}:${String(sec % 60).padStart(2, "0")}`], ["Max mass", Math.round(maxMass)], ["Heads grown", clashHeads],
    ["Wolves devoured", kills], ["Survival score", survivalScore], [`Boss damage (×${10 * runBossLevel})`, bossDamage],
    [bossDefeated ? "Alpha bonus (defeated!)" : "Alpha bonus", "+" + (bossDefeated ? 250 * runBossLevel : 0)]
  ];
  if (doubled) rows.push(["Ad reward", "Boss score ×2"]);
  for (const [k, v] of rows) { text(k, lx, y, 24 * u, "rgba(255,255,255,0.8)", "left", BODY); text(String(v), rx, y, 24 * u, "#fff", "right", BODY); y += step; }
  line(lx, y - step * 0.5, rx, y - step * 0.5, "rgba(255,255,255,0.33)", 2 * u);
  y += step * 0.4;
  text("TOTAL", lx, y, 40 * u, "#fff", "left"); text(String(totalScore), rx, y, 40 * u, "#FFD740", "right");
  y += step;
  text(newBest ? "NEW BEST SCORE!" : "Best: " + bestScore, w / 2, y, 26 * u, newBest ? "#69F0AE" : "rgba(255,255,255,0.65)", "center", BODY);
  if (showDouble()) button(doubleBtn(), "▶ WATCH AD · 2× BOSS SCORE", "#E0A100");
  button(againBtn(), "PLAY AGAIN", "#2979FF"); button(menuBtn(), "MENU", "#455A64");
  drawParticles();
}
function drawOffline() {
  ctx.fillStyle = "rgba(8,14,11,0.93)"; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h * 0.36, checking = net.state === NET.CHECKING, col = checking ? "#FFD740" : "#FF5252";
  ctx.strokeStyle = col; ctx.lineWidth = 14 * u;
  for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(cx, cy, i * 45 * u, Math.PI * 1.25, Math.PI * 1.75); ctx.stroke(); }
  circle(cx, cy, 14 * u, col);
  if (!checking) line(cx - 120 * u, cy - 150 * u, cx + 120 * u, cy + 30 * u, "#FF5252", 14 * u);
  text(checking ? "Checking connection…" : "No Internet Connection", cx, h * 0.48, 38 * u, "#fff");
  text("Wolf Clash Arena needs an active", cx, h * 0.48 + 56 * u, 26 * u, "rgba(255,255,255,0.75)", "center", BODY);
  text("internet connection to play.", cx, h * 0.48 + 94 * u, 26 * u, "rgba(255,255,255,0.75)", "center", BODY);
  if (!checking) button(retryBtn(), "RETRY", "#2979FF");
}

// ---------------- loop ----------------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05;
  if (w > 0) { update(dt, now); draw(); }
  requestAnimationFrame(frame);
}
resize();
if (document.fonts && document.fonts.load) { document.fonts.load(`40px ${DISPLAY}`).catch(() => {}); document.fonts.load(`20px ${BODY}`).catch(() => {}); }
window.__wolf = { get state() { return state; }, get player() { return player; }, startGame, grow: d => playerGrow(d), ko: () => knockOut(), down: () => { hearts = 0; playerDown(); }, get counts() { return [food.length, enemies.length, rabbits.length, particles.length, floaters.length, elapsed | 0]; } };
requestAnimationFrame(frame);
cv.focus({ preventScroll: true });
})();
</script>
