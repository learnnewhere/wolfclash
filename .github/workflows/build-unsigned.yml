# Builds Wolf Clash Arena (with AdMob ads) WITHOUT signing. No secrets needed.
# The unsigned AAB/APK are then signed offline with the upload key (never stored on GitHub).
name: Build unsigned AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Disable signing for this build
        run: sed -i '/signingConfig signingConfigs.release/d' app/build.gradle

      - name: Build release AAB and APK (unsigned)
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Collect files
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/bundle/release/*.aab out/WolfClashArena-${VER}-ads-unsigned.aab
          cp app/build/outputs/apk/release/*.apk out/WolfClashArena-${VER}-ads-unsigned.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: WolfClashArena-${{ env.VER }}-ads-unsigned
          path: out/
          retention-days: 7
