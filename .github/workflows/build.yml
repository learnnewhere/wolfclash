# Builds Wolf Clash Arena (with AdMob ads) on GitHub's servers and signs it with your upload key.
# Run it from the repository's "Actions" tab -> "Build signed AAB" -> "Run workflow".
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   UPLOAD_KEYSTORE_BASE64   = your upload-keystore.p12, base64-encoded
#   UPLOAD_KEYSTORE_PASSWORD = the storePassword from keystore.properties
name: Build signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore upload key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PW" ]; then
            echo "::error::Add the UPLOAD_KEYSTORE_BASE64 and UPLOAD_KEYSTORE_PASSWORD repository secrets first."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > upload-keystore.p12
          printf 'storeFile=upload-keystore.p12\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$KEYSTORE_PW" "$KEYSTORE_PW" > keystore.properties

      - name: Build release AAB and APK
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Collect files
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle | cut -d'"' -f2)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/bundle/release/*.aab out/WolfClashArena-${VER}-ads.aab
          cp app/build/outputs/apk/release/*.apk out/WolfClashArena-${VER}-ads.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WolfClashArena-${{ env.VER }}-ads
          path: out/
          retention-days: 14

      - name: Remove key files
        if: always()
        run: rm -f upload-keystore.p12 keystore.properties
